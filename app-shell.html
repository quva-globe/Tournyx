<!DOCTYPE html>
<html class="dark" lang="en" style="color-scheme: dark; background-color: #050508;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050508">
  <title>Tournyx Esports</title>
  <link rel="stylesheet" href="vendor/fa/css/all.min.css" onerror="this.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css'">
  <link rel="stylesheet" href="vendor/tournyx-theme.css" onerror="this.href='styles/tournyx-theme.css'">
  <link rel="stylesheet" href="vendor/native-app-shell.css" onerror="this.href='styles/native-app-shell.css'">
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #050508;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
    }

    #tx-shell-stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      background: #050508;
      overflow: hidden;
    }

    .tx-stage-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #050508;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      z-index: 1;
      transition: opacity 0.16s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .tx-stage-frame.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      z-index: 5;
    }

    /* Floating Liquid Glass Voice Pill (Visible on Other Pages While Connected in Voice) */
    #tx-floating-voice-pill {
      position: fixed;
      left: 50%;
      bottom: calc(78px + env(safe-area-inset-bottom, 0px));
      transform: translate3d(-50%, 16px, 0);
      width: min(calc(100vw - 24px), 420px);
      z-index: 4900;
      padding: 8px 10px 8px 14px;
      border-radius: 9999px;
      background: linear-gradient(145deg, rgba(24, 22, 48, 0.90) 0%, rgba(10, 12, 24, 0.95) 100%);
      backdrop-filter: saturate(195%) blur(24px);
      -webkit-backdrop-filter: saturate(195%) blur(24px);
      border: 1px solid rgba(139, 92, 246, 0.48);
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.24);
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), bottom 0.22s ease;
    }

    @media (min-width: 1024px) {
      #tx-floating-voice-pill {
        left: auto;
        right: 22px;
        bottom: 22px;
        transform: translate3d(0, 16px, 0);
        width: 340px;
      }
      #tx-floating-voice-pill.is-active { transform: translate3d(0, 0, 0); }
    }

    #tx-floating-voice-pill.is-active {
      display: flex;
      opacity: 1;
      transform: translate3d(-50%, 0, 0);
    }

    .tx-fv-dot {
      width: 9px;
      height: 9px;
      border-radius: 9999px;
      background: #10B981;
      box-shadow: 0 0 10px #10B981;
      flex-shrink: 0;
      animation: txPulseDot 1.6s infinite ease-in-out;
    }

    @keyframes txPulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.32); opacity: 0.65; }
    }

    .tx-fv-info {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
      background: none;
      border: none;
      padding: 4px 0;
      text-align: left;
      color: #FFFFFF;
      cursor: pointer;
    }

    .tx-fv-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .tx-fv-btn {
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
    }

    .tx-fv-btn.is-muted { background: rgba(239, 68, 68, 0.24); border-color: rgba(239, 68, 68, 0.55); color: #FCA5A5; }
    .tx-fv-btn.is-speaker-on { background: rgba(56, 189, 248, 0.22); border-color: rgba(56, 189, 248, 0.55); color: #38BDF8; }
    .tx-fv-btn.is-hangup { background: #EF4444; border-color: #EF4444; color: #FFFFFF; }
  </style>
</head>
<body class="is-native-app">
  <!-- Stacked Native Frames: Main Content + Persistent Clan Voice Host -->
  <div id="tx-shell-stage">
    <iframe id="tx-main-frame" class="tx-stage-frame is-visible"
      allow="geolocation *; microphone *; camera *; display-capture *; autoplay *; clipboard-write *; fullscreen *"
      title="Tournyx Arena"></iframe>
    <iframe id="tx-clans-frame" class="tx-stage-frame"
      allow="geolocation *; microphone *; camera *; display-capture *; autoplay *; clipboard-write *; fullscreen *"
      title="Tournyx Clans & Voice"></iframe>
  </div>

  <!-- 360° Inward-Absorbing Energy Loader (24 Streams Pulling Inward Behind Frameless TX Logo) -->
  <div id="tx-common-loader" role="status" aria-live="polite">
    <div class="tx-absorb-stage">
      <div class="tx-absorb-core-glow" aria-hidden="true"></div>
      <div class="tx-absorb-ring" aria-hidden="true"></div>
      <div class="tx-absorb-ring is-second" aria-hidden="true"></div>
      <div class="tx-absorb-streams" aria-hidden="true">
        <span class="tx-absorb-ray" style="--i:0"></span><span class="tx-absorb-ray" style="--i:1"></span>
        <span class="tx-absorb-ray" style="--i:2"></span><span class="tx-absorb-ray" style="--i:3"></span>
        <span class="tx-absorb-ray" style="--i:4"></span><span class="tx-absorb-ray" style="--i:5"></span>
        <span class="tx-absorb-ray" style="--i:6"></span><span class="tx-absorb-ray" style="--i:7"></span>
        <span class="tx-absorb-ray" style="--i:8"></span><span class="tx-absorb-ray" style="--i:9"></span>
        <span class="tx-absorb-ray" style="--i:10"></span><span class="tx-absorb-ray" style="--i:11"></span>
        <span class="tx-absorb-ray" style="--i:12"></span><span class="tx-absorb-ray" style="--i:13"></span>
        <span class="tx-absorb-ray" style="--i:14"></span><span class="tx-absorb-ray" style="--i:15"></span>
        <span class="tx-absorb-ray" style="--i:16"></span><span class="tx-absorb-ray" style="--i:17"></span>
        <span class="tx-absorb-ray" style="--i:18"></span><span class="tx-absorb-ray" style="--i:19"></span>
        <span class="tx-absorb-ray" style="--i:20"></span><span class="tx-absorb-ray" style="--i:21"></span>
        <span class="tx-absorb-ray" style="--i:22"></span><span class="tx-absorb-ray" style="--i:23"></span>
      </div>
      <img class="tx-absorb-logo" src="logo-transparent.png" onerror="this.onerror=null;this.src='favicon.png'" alt="Tournyx">
    </div>
    <div id="tx-loader-label" class="tx-burst-label">Syncing Arena</div>
  </div>

  <!-- Continuous-Back Exit Confirmation Modal -->
  <div id="tx-exit-confirm" role="dialog" aria-modal="true" aria-labelledby="txExitTitle">
    <div class="tx-exit-card">
      <img src="logo-transparent.png" onerror="this.onerror=null;this.src='favicon.png'" alt="Tournyx"
        style="width:52px;height:52px;object-fit:contain;background:transparent;">
      <div id="txExitTitle" style="font-size:16px;font-weight:800;color:#FFFFFF;">Exit Tournyx Esports?</div>
      <div style="font-size:12px;color:#94A3B8;line-height:1.45;">
        Press Back again to exit immediately, or stay in the arena.
      </div>
      <div class="tx-exit-actions">
        <button id="txExitStayBtn" type="button" class="tx-btn-glass" style="min-height:44px;">Stay</button>
        <button id="txExitNowBtn" type="button" class="tx-btn-primary" style="min-height:44px;background:linear-gradient(135deg,#EF4444,#B91C1C);">Exit App</button>
      </div>
    </div>
  </div>

  <!-- Floating Liquid Glass Voice Pill -->
  <div id="tx-floating-voice-pill" role="region" aria-label="Active Squad Voice Room">
    <button id="txFvReturnBtn" class="tx-fv-info" type="button" title="Return to Voice Room">
      <span class="tx-fv-dot"></span>
      <div style="min-width:0;">
        <div id="txFvTitle" style="font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Clan Voice Connected</div>
        <div style="font-size:10px;color:#38BDF8;font-family:monospace;">Tap to return to room</div>
      </div>
    </button>
    <div class="tx-fv-actions">
      <button id="txFvMuteBtn" class="tx-fv-btn" type="button" aria-label="Toggle Mute"><i class="fa-solid fa-microphone"></i></button>
      <button id="txFvSpeakerBtn" class="tx-fv-btn is-speaker-on" type="button" aria-label="Toggle Speaker"><i class="fa-solid fa-volume-high"></i></button>
      <button id="txFvLeaveBtn" class="tx-fv-btn is-hangup" type="button" aria-label="Leave Voice Room"><i class="fa-solid fa-phone-slash"></i></button>
    </div>
  </div>

  <!-- YouTube + Instagram Hybrid Liquid Glass Scrubbing Capsule Dock -->
  <nav id="tx-native-dock" aria-label="Tournyx Primary Navigation" style="display:none;">
    <div id="tx-dock-lens" aria-hidden="true"></div>
    <button type="button" class="tx-dock-item is-active" data-dock-idx="0" data-dock-tab="index.html"><i class="fa-solid fa-house"></i><span>Home</span></button>
    <button type="button" class="tx-dock-item" data-dock-idx="1" data-dock-tab="explore.html"><i class="fa-solid fa-compass"></i><span>Explore</span></button>
    <button type="button" class="tx-dock-item" data-dock-idx="2" data-dock-tab="matches.html"><i class="fa-solid fa-trophy"></i><span>Matches</span></button>
    <button type="button" class="tx-dock-item" data-dock-idx="3" data-dock-tab="reels.html"><i class="fa-solid fa-clapperboard"></i><span>Reels</span></button>
    <button type="button" class="tx-dock-item" data-dock-idx="4" data-dock-tab="clans.html"><i class="fa-solid fa-shield-halved"></i><span>Clans</span></button>
    <button type="button" class="tx-dock-item" data-dock-idx="5" data-dock-tab="profile.html"><i class="fa-solid fa-user"></i><span>Profile</span></button>
  </nav>

  <script>
    (() => {
      "use strict";

      const OAUTH_CALLBACK_URI = "in.tournyx.app://auth/callback";
      const APP_OPEN_URI = "in.tournyx.app://open";
      const SUPABASE_AUTH_STORAGE_KEY = "sb-zuatrwfrejnwfnldqqgy-auth-token";
      const DOCK_ORDER = ["index.html", "explore.html", "matches.html", "reels.html", "clans.html", "profile.html"];

      const KNOWN_PAGES = new Set([
        "index", "explore", "matches", "reels", "clans", "tournament",
        "resolve", "tickets", "profile", "login", "giveaway", "offer",
        "refer", "premium", "settings", "notifications", "support",
        "about", "contact", "feedback", "leaderboard", "blogs",
        "discord", "instagram", "youtube", "privacy", "terms", "refund",
        "Globe-support", "maintenance"
      ]);

      const AUTH_EXEMPT_PAGES = new Set([
        "login.html", "privacy.html", "terms.html", "refund.html", "support.html", "about.html"
      ]);

      const PERSISTED_KEYS = [
        "tournyx_user",
        SUPABASE_AUTH_STORAGE_KEY,
        "tournyx_perf_tier",
        "tournyx_theme_config",
        "tournyx_psm",
        "tx_onboard_v6_done",
        "tx_perms_boot_v2"
      ];

      const isCapacitor = Boolean(window.Capacitor?.isNativePlatform?.());
      const isTauri = Boolean(window.__TAURI_INTERNALS__ || window.__TAURI__);
      const platform = isCapacitor
        ? (window.Capacitor.getPlatform?.() || "android").toLowerCase()
        : (isTauri ? (/Mac/i.test(navigator.userAgent) ? "macos" : "windows") : "web");

      document.documentElement.dataset.txPlatform = platform;
      document.documentElement.dataset.txNative = "true";
      document.body.classList.add(`platform-${platform}`);

      // 3-Tier Adaptive Performance Engine (Ultra / Balanced / Lite)
      function applyAdaptivePerfTier(manualTier) {
        let tier = manualTier || localStorage.getItem("tournyx_perf_tier") || "";
        if (!tier) {
          const mem = Number(navigator.deviceMemory) || 4;
          const cores = Number(navigator.hardwareConcurrency) || 4;
          const saveData = Boolean(navigator.connection?.saveData);
          const reduce = Boolean(window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches);
          if (reduce || saveData || mem <= 2 || cores <= 2) tier = "lite";
          else if (mem >= 6 && cores >= 6) tier = "ultra";
          else tier = "balanced";
        }
        document.documentElement.setAttribute("data-perf-tier", tier);
        return tier;
      }
      applyAdaptivePerfTier();

      const mainFrame = document.getElementById("tx-main-frame");
      const clansFrame = document.getElementById("tx-clans-frame");
      const dockEl = document.getElementById("tx-native-dock");
      const dockLens = document.getElementById("tx-dock-lens");
      const dockItems = Array.from(dockEl?.querySelectorAll("[data-dock-tab]") || []);
      const voicePill = document.getElementById("tx-floating-voice-pill");
      const loaderEl = document.getElementById("tx-common-loader");
      const loaderLabelEl = document.getElementById("tx-loader-label");
      const exitConfirmEl = document.getElementById("tx-exit-confirm");

      let activeLayer = "main";
      let currentPage = "index.html";
      let clansLoaded = false;
      let isNavigating = false;
      let navLockTimer = null;
      let loaderDelayTimer = null;
      let loaderFailsafeTimer = null;
      let overlayHidesDock = false;
      let scrollHidesDock = false;
      let hangupCooldownUntil = 0;
      let exitPromptOpenedAt = 0;
      let voiceState = { active: false, roomName: "Tournyx Squad Voice", muted: false, speaker: true };

      function isTrustedMessageOrigin(origin) {
        if (!origin || origin === "null" || origin === window.location.origin) return true;
        try {
          const h = new URL(origin).hostname.toLowerCase();
          return h === "app.tournyx.in" || h === "tournyx.in" || h === "www.tournyx.in" || h === "localhost" || h === "tauri.localhost";
        } catch (e) {
          return false;
        }
      }

      function doHaptic(style = "light") {
        try {
          if (window.Capacitor?.Plugins?.Haptics?.impact) {
            window.Capacitor.Plugins.Haptics.impact({ style: style === "heavy" ? "HEAVY" : "LIGHT" });
            return;
          }
          if (navigator.vibrate) navigator.vibrate(style === "heavy" ? 22 : 9);
        } catch (e) {}
      }

      function showLoader(label = "Syncing Arena", delayMs = 0) {
        clearTimeout(loaderDelayTimer);
        clearTimeout(loaderFailsafeTimer);
        const activate = () => {
          if (loaderLabelEl) loaderLabelEl.textContent = String(label || "Syncing Arena");
          loaderEl?.classList.add("is-active");
          loaderFailsafeTimer = setTimeout(() => hideLoader(), 6500);
        };
        if (delayMs > 0) loaderDelayTimer = setTimeout(activate, delayMs);
        else activate();
      }

      function hideLoader() {
        clearTimeout(loaderDelayTimer);
        clearTimeout(loaderFailsafeTimer);
        loaderEl?.classList.remove("is-active");
      }

      function toggleExitConfirm(show) {
        if (!exitConfirmEl) return;
        const open = Boolean(show);
        exitConfirmEl.classList.toggle("is-active", open);
        if (open) {
          exitPromptOpenedAt = Date.now();
          doHaptic("light");
        }
      }

      document.getElementById("txExitStayBtn")?.addEventListener("click", () => toggleExitConfirm(false));
      document.getElementById("txExitNowBtn")?.addEventListener("click", () => {
        toggleExitConfirm(false);
        window.Capacitor?.Plugins?.App?.exitApp?.();
      });
      exitConfirmEl?.addEventListener("click", (e) => {
        if (e.target === exitConfirmEl) toggleExitConfirm(false);
      });

      function hasValidUser() {
        try {
          const raw = localStorage.getItem("tournyx_user");
          if (!raw || raw === "undefined" || raw === "null") return false;
          const u = JSON.parse(raw);
          return Boolean(u?.email && String(u.email).toLowerCase() !== "guest@tournyx.com");
        } catch (e) { return false; }
      }

      async function hydrateNativePreferences() {
        if (!isCapacitor) return;
        const prefs = window.Capacitor?.Plugins?.Preferences;
        if (!prefs?.get) return;
        for (const key of PERSISTED_KEYS) {
          try {
            const cur = localStorage.getItem(key);
            if (!cur || cur === "undefined" || cur === "null") {
              const res = await prefs.get({ key });
              if (res?.value && res.value !== "undefined" && res.value !== "null") {
                localStorage.setItem(key, res.value);
              }
            }
          } catch (e) {}
        }
      }

      function resolvePageUrl(raw) {
        const s = String(raw || "index.html").trim();
        let candidate = s;
        try {
          if (s.toLowerCase().startsWith(APP_OPEN_URI)) {
            const u = new URL(s);
            const pParam = u.searchParams.get("page") || u.pathname.replace(/^\/+/, "") || "index.html";
            u.searchParams.delete("page");
            const extraQ = u.searchParams.toString();
            candidate = pParam + (extraQ ? (pParam.includes("?") ? "&" : "?") + extraQ : "") + (u.hash || "");
          } else {
            const u = new URL(s, window.location.origin);
            const h = u.hostname.toLowerCase();
            if (h === "tournyx.in" || h === "www.tournyx.in" || h === "app.tournyx.in" || h === "localhost" || h === "tauri.localhost") {
              candidate = u.pathname + u.search + u.hash;
            } else if (/^https?:\/\//i.test(s)) {
              return null;
            }
          }
        } catch (e) { return null; }

        if (candidate === "/" || candidate === "") return "index.html";
        const m = candidate.match(/^\/?([A-Za-z0-9_-]+)(?:\.html)?(\?[^#]*)?(#.*)?$/);
        if (m && KNOWN_PAGES.has(m[1])) return `${m[1]}.html${m[2] || ""}${m[3] || ""}`;
        return null;
      }

      function getCurrentTabIndex() {
        const fileOnly = (activeLayer === "clans" ? "clans.html" : (currentPage.split("?")[0].split("#")[0] || "index.html")).toLowerCase();
        const idx = DOCK_ORDER.indexOf(fileOnly);
        return idx >= 0 ? idx : 0;
      }

      function positionDockLens(tabIdx, overridePx = null) {
        if (!dockEl || !dockLens) return;
        const innerWidth = Math.max(0, dockEl.clientWidth - 10);
        const slotWidth = innerWidth / DOCK_ORDER.length;
        const x = overridePx !== null
          ? Math.max(0, Math.min(innerWidth - slotWidth, overridePx))
          : (tabIdx * slotWidth);
        dockLens.style.setProperty("--tx-lens-x", `${x.toFixed(1)}px`);
      }

      function updateDockAndPillVisibility() {
        const pageFile = (currentPage.split("?")[0].split("#")[0] || "index.html").toLowerCase();
        const hideDockPermanent = pageFile === "login.html" || pageFile === "reels.html";
        const activeIdx = getCurrentTabIndex();

        if (dockEl) {
          dockEl.style.display = hideDockPermanent ? "none" : "";
          dockEl.classList.toggle("is-hidden-for-overlay", !hideDockPermanent && overlayHidesDock);
          dockEl.classList.toggle("is-scroll-hidden", !hideDockPermanent && !overlayHidesDock && scrollHidesDock);
          dockItems.forEach((btn, i) => btn.classList.toggle("is-active", i === activeIdx));
          if (!hideDockPermanent) requestAnimationFrame(() => positionDockLens(activeIdx));
        }

        const showPill = voiceState.active && activeLayer !== "clans" && pageFile !== "login.html";
        if (voicePill) {
          voicePill.classList.toggle("is-active", showPill);
          const dockCurrentlyVisible = !hideDockPermanent && !overlayHidesDock && !scrollHidesDock;
          voicePill.style.bottom = dockCurrentlyVisible
            ? "calc(78px + env(safe-area-inset-bottom, 0px))"
            : "calc(16px + env(safe-area-inset-bottom, 0px))";
        }

        const titleEl = document.getElementById("txFvTitle");
        if (titleEl) titleEl.textContent = voiceState.roomName || "Clan Voice Connected";
        const muteBtn = document.getElementById("txFvMuteBtn");
        if (muteBtn) {
          muteBtn.classList.toggle("is-muted", Boolean(voiceState.muted));
          muteBtn.innerHTML = `<i class="fa-solid ${voiceState.muted ? "fa-microphone-slash" : "fa-microphone"}"></i>`;
        }
        const spkBtn = document.getElementById("txFvSpeakerBtn");
        if (spkBtn) {
          spkBtn.classList.toggle("is-speaker-on", Boolean(voiceState.speaker));
          spkBtn.innerHTML = `<i class="fa-solid ${voiceState.speaker ? "fa-volume-high" : "fa-phone-volume"}"></i>`;
        }
      }

      // iOS 26 Horizontal Scrubbing Lens on Bottom Capsule Dock
      function initLiquidDockScrubbing() {
        if (!dockEl) return;
        let activePointer = null;
        let startX = 0;
        let isDragging = false;
        let hoveredIdx = getCurrentTabIndex();

        const indexFromClientX = (clientX) => {
          const rect = dockEl.getBoundingClientRect();
          const innerW = Math.max(1, rect.width - 10);
          const relX = Math.max(0, Math.min(innerW - 1, clientX - rect.left - 5));
          const slotW = innerW / DOCK_ORDER.length;
          const idx = Math.max(0, Math.min(DOCK_ORDER.length - 1, Math.floor(relX / slotW)));
          return { idx, lensPx: relX - slotW / 2 };
        };

        dockEl.addEventListener("touchstart", (e) => {
          if (e.touches.length !== 1) return;
          activePointer = e.touches[0].identifier;
          startX = e.touches[0].clientX;
          isDragging = false;
          hoveredIdx = getCurrentTabIndex();
        }, { passive: true });

        dockEl.addEventListener("touchmove", (e) => {
          if (activePointer === null) return;
          const t = Array.from(e.touches).find((x) => x.identifier === activePointer);
          if (!t) return;
          if (!isDragging && Math.abs(t.clientX - startX) > 9) {
            isDragging = true;
            dockEl.classList.add("is-scrubbing");
          }
          if (!isDragging) return;
          e.preventDefault();
          const { idx, lensPx } = indexFromClientX(t.clientX);
          positionDockLens(idx, lensPx);
          if (idx !== hoveredIdx) {
            hoveredIdx = idx;
            doHaptic("light");
            dockItems.forEach((b, i) => b.classList.toggle("is-active", i === idx));
          }
        }, { passive: false });

        const endScrub = () => {
          if (activePointer === null) return;
          const wasDragging = isDragging;
          const targetIdx = hoveredIdx;
          activePointer = null;
          isDragging = false;
          dockEl.classList.remove("is-scrubbing");
          if (wasDragging) {
            positionDockLens(targetIdx);
            navigate(DOCK_ORDER[targetIdx]);
          }
        };

        dockEl.addEventListener("touchend", endScrub, { passive: true });
        dockEl.addEventListener("touchcancel", endScrub, { passive: true });

        dockItems.forEach((btn, idx) => {
          btn.addEventListener("click", () => {
            positionDockLens(idx);
            navigate(btn.dataset.dockTab);
          });
        });

        window.addEventListener("resize", () => positionDockLens(getCurrentTabIndex()), { passive: true });
      }

      function navigate(rawHref, options = {}) {
        const resolved = resolvePageUrl(rawHref) || "index.html";
        const fileOnly = resolved.split("?")[0].split("#")[0].toLowerCase();

        if (!AUTH_EXEMPT_PAGES.has(fileOnly) && !hasValidUser()) {
          return navigate("login.html", { force: true });
        }

        if (!options.force && isNavigating) return;
        isNavigating = true;
        clearTimeout(navLockTimer);
        navLockTimer = setTimeout(() => { isNavigating = false; hideLoader(); }, 2200);

        overlayHidesDock = false;
        scrollHidesDock = false;
        toggleExitConfirm(false);
        if (!options.silent) doHaptic("light");

        if (fileOnly === "clans.html") {
          activeLayer = "clans";
          currentPage = resolved;
          if (!clansLoaded || (resolved.includes("?") && !voiceState.active)) {
            if (!options.silent) showLoader("Loading Clans", 150);
            clansFrame.src = resolved;
            clansLoaded = true;
          } else {
            isNavigating = false;
            hideLoader();
          }
          mainFrame.classList.remove("is-visible");
          clansFrame.classList.add("is-visible");
          updateDockAndPillVisibility();
          return;
        }

        activeLayer = "main";
        const prevMain = mainFrame.getAttribute("data-loaded-url") || "";
        currentPage = resolved;
        clansFrame.classList.remove("is-visible");
        mainFrame.classList.add("is-visible");

        if (prevMain !== resolved || options.force) {
          if (!options.silent) showLoader("Loading Arena", 150);
          mainFrame.setAttribute("data-loaded-url", resolved);
          mainFrame.src = resolved;
        } else {
          isNavigating = false;
          hideLoader();
        }
        updateDockAndPillVisibility();
      }

      function stepTab(delta) {
        const curIdx = getCurrentTabIndex();
        const nextIdx = curIdx + (delta > 0 ? 1 : -1);
        if (nextIdx < 0 || nextIdx >= DOCK_ORDER.length) return;
        navigate(DOCK_ORDER[nextIdx]);
      }

      mainFrame.addEventListener("load", () => {
        isNavigating = false;
        overlayHidesDock = false;
        scrollHidesDock = false;
        hideLoader();
        try {
          const p = (mainFrame.contentWindow?.location?.pathname?.split("/").pop() || "index.html");
          const s = mainFrame.contentWindow?.location?.search || "";
          if (p.toLowerCase() === "clans.html") {
            navigate(`clans.html${s}`, { force: true, silent: true });
            return;
          }
          currentPage = `${p}${s}`;
          mainFrame.setAttribute("data-loaded-url", currentPage);
        } catch (e) {}
        updateDockAndPillVisibility();
      });

      clansFrame.addEventListener("load", () => {
        isNavigating = false;
        overlayHidesDock = false;
        scrollHidesDock = false;
        hideLoader();
        updateDockAndPillVisibility();
      });

      // Strict Two-Way Anti-Ghost Voice State Sync
      function setVoiceState(patch, source = "page") {
        const nextActive = patch?.active !== undefined ? Boolean(patch.active) : voiceState.active;
        if (nextActive && Date.now() < hangupCooldownUntil) return;

        const wasActive = voiceState.active;
        voiceState = Object.assign({}, voiceState, patch || {}, { active: nextActive });
        updateDockAndPillVisibility();

        if (source === "native") return; // Already updated inside TournyxVoiceService

        try {
          const ab = window.TournyxAndroidBridge;
          if (!ab) return;
          if (voiceState.active && !wasActive) {
            ab.startVoiceService(String(voiceState.roomName || "Tournyx Squad Voice"));
            setTimeout(() => {
              try {
                if (voiceState.active && ab.isVoiceServiceActive?.()) {
                  ab.updateVoiceService(
                    String(voiceState.roomName || "Tournyx Squad Voice"),
                    Boolean(voiceState.muted),
                    Boolean(voiceState.speaker)
                  );
                }
              } catch (e) {}
            }, 220);
          } else if (voiceState.active && wasActive) {
            if (ab.isVoiceServiceActive?.()) {
              ab.updateVoiceService(
                String(voiceState.roomName || "Tournyx Squad Voice"),
                Boolean(voiceState.muted),
                Boolean(voiceState.speaker)
              );
            }
          } else if (!voiceState.active && (wasActive || ab.isVoiceServiceActive?.())) {
            hangupCooldownUntil = Date.now() + 5000;
            ab.stopVoiceService();
          }
        } catch (e) {}
      }

      function forwardVoiceActionToClans(action, explicitState = null, fromNative = false) {
        if (!fromNative) doHaptic("light");

        if (action === "mute") {
          const nextMuted = explicitState && typeof explicitState.muted === "boolean"
            ? explicitState.muted
            : !voiceState.muted;
          setVoiceState({ active: voiceState.active, muted: nextMuted }, fromNative ? "native" : "shell");
        } else if (action === "speaker") {
          const nextSpeaker = explicitState && typeof explicitState.speaker === "boolean"
            ? explicitState.speaker
            : !voiceState.speaker;
          if (!fromNative) {
            try { window.TournyxAndroidBridge?.setSpeakerphone?.(nextSpeaker); } catch (e) {}
          }
          setVoiceState({ active: voiceState.active, speaker: nextSpeaker }, fromNative ? "native" : "shell");
        } else if (action === "leave") {
          hangupCooldownUntil = Date.now() + 5000;
          setVoiceState({ active: false, muted: false }, fromNative ? "native" : "shell");
        }

        try {
          clansFrame.contentWindow?.postMessage(
            { type: "TX_SHELL_VOICE_ACTION", action, state: Object.assign({}, voiceState) },
            window.location.origin
          );
        } catch (e) {}
      }

      // Direct Top-Level Native OAuth Launcher (Fixes Iframe Freeze Across Android/iOS/Desktop)
      async function openNativeOAuth(url) {
        if (!url || !/^https?:\/\//i.test(url)) return false;
        showLoader("Opening Account Picker");
        setTimeout(() => hideLoader(), 1200);

        if (platform === "android" && window.TournyxAndroidBridge?.openOAuthUrl) {
          try {
            window.TournyxAndroidBridge.openOAuthUrl(url);
            return true;
          } catch (e) {}
        }

        if (isCapacitor && window.Capacitor?.Plugins?.Browser?.open) {
          try {
            await window.Capacitor.Plugins.Browser.open({
              url,
              toolbarColor: "#050508",
              presentationStyle: "popover"
            });
            return true;
          } catch (e) {}
        }

        if (isTauri && window.__TAURI_INTERNALS__?.invoke) {
          try {
            await window.__TAURI_INTERNALS__.invoke("plugin:opener|open_url", { url });
            return true;
          } catch (e) {}
        }
        return false;
      }

      document.getElementById("txFvReturnBtn")?.addEventListener("click", () => navigate("clans.html", { force: true }));
      document.getElementById("txFvMuteBtn")?.addEventListener("click", () => forwardVoiceActionToClans("mute"));
      document.getElementById("txFvSpeakerBtn")?.addEventListener("click", () => forwardVoiceActionToClans("speaker"));
      document.getElementById("txFvLeaveBtn")?.addEventListener("click", () => forwardVoiceActionToClans("leave"));

      function broadcastToFrames(eventName, detail) {
        [mainFrame, clansFrame].forEach((f) => {
          try { f?.contentWindow?.dispatchEvent(new CustomEvent(eventName, { detail })); } catch (err) {}
        });
      }

      window.addEventListener("tournyx:native-location", (e) => broadcastToFrames("tournyx:native-location", e.detail));
      window.addEventListener("tournyx:native-location-error", (e) => broadcastToFrames("tournyx:native-location-error", e.detail));
      window.addEventListener("tournyx:permissions-result", (e) => broadcastToFrames("tournyx:permissions-result", e.detail));
      window.addEventListener("tournyx:screen-frame", (e) => broadcastToFrames("tournyx:screen-frame", e.detail));
      window.addEventListener("tournyx:screen-share-ready", (e) => broadcastToFrames("tournyx:screen-share-ready", e.detail));
      window.addEventListener("tournyx:screen-share-denied", () => broadcastToFrames("tournyx:screen-share-denied", {}));

      window.addEventListener("tournyx:native-voice-action", (e) => {
        const d = e?.detail || {};
        if (d.action === "mute" || d.action === "speaker" || d.action === "leave") {
          forwardVoiceActionToClans(d.action, d, true);
        } else if (d.action === "open_room") {
          navigate("clans.html", { force: true, silent: true });
        }
      });

      window.addEventListener("message", (e) => {
        if (!isTrustedMessageOrigin(e.origin)) return;
        const msg = e?.data;
        if (!msg || typeof msg !== "object") return;
        if (msg.type === "TX_NAVIGATE" && msg.href) navigate(msg.href, msg.options);
        else if (msg.type === "TX_STEP_TAB") stepTab(Number(msg.delta) || 0);
        else if (msg.type === "TX_VOICE_STATE") setVoiceState(msg.state, "page");
        else if (msg.type === "TX_OPEN_OAUTH" && msg.url) openNativeOAuth(msg.url);
        else if (msg.type === "TX_OVERLAY_STATE") {
          overlayHidesDock = Boolean(msg.hidden);
          updateDockAndPillVisibility();
        } else if (msg.type === "TX_DOCK_SCROLL") {
          scrollHidesDock = Boolean(msg.hidden);
          updateDockAndPillVisibility();
        } else if (msg.type === "TX_LOADER") {
          if (msg.active) showLoader(msg.label || "Syncing Arena", 0);
          else hideLoader();
        }
      });

      window.TournyxShell = {
        navigate,
        stepTab,
        setVoiceState: (st) => setVoiceState(st, "page"),
        getVoiceState: () => Object.assign({}, voiceState),
        forwardVoiceAction: (act) => forwardVoiceActionToClans(act),
        openNativeOAuth,
        showLoader,
        hideLoader,
        setPerfTier: (t) => {
          localStorage.setItem("tournyx_perf_tier", t);
          applyAdaptivePerfTier(t);
          broadcastToFrames("tournyx:perf-tier-change", { tier: t });
        }
      };

      async function handleOAuthReturn(urlStr) {
        try { await window.Capacitor?.Plugins?.Browser?.close?.(); } catch (e) {}
        showLoader("Completing Sign-In");
        try {
          const parsed = new URL(urlStr);
          const q = new URLSearchParams(parsed.search || "");
          const h = new URLSearchParams((parsed.hash || "").replace(/^#/, ""));
          const code = q.get("code");
          const accessToken = h.get("access_token") || q.get("access_token");
          const refreshToken = h.get("refresh_token") || q.get("refresh_token");

          if (code) {
            navigate(`login.html?code=${encodeURIComponent(code)}&native_oauth=1`, { force: true, silent: true });
          } else if (accessToken && refreshToken) {
            navigate(`login.html?native_oauth=1#access_token=${encodeURIComponent(accessToken)}&refresh_token=${encodeURIComponent(refreshToken)}`, { force: true, silent: true });
          } else {
            navigate("login.html?native_oauth=1", { force: true, silent: true });
          }
        } catch (e) {
          hideLoader();
          navigate("login.html", { force: true, silent: true });
        }
      }

      function initNetworkTelemetry() {
        const update = (online) => {
          let pill = document.getElementById("tx-offline-pill");
          if (!online) {
            if (!pill) {
              pill = document.createElement("div");
              pill.id = "tx-offline-pill";
              pill.innerHTML = '<i class="fa-solid fa-wifi" style="color:#EF4444;"></i><span>You are offline — showing cached data</span>';
              document.body.appendChild(pill);
            }
          } else if (pill) {
            pill.remove();
          }
        };
        window.addEventListener("offline", () => update(false));
        window.addEventListener("online", () => update(true));
        if (!navigator.onLine) update(false);
      }

      function triggerStartupNativePermissions() {
        if (platform === "android" && window.TournyxAndroidBridge) {
          try {
            if (localStorage.getItem("tx_perms_boot_v2") !== "1") {
              localStorage.setItem("tx_perms_boot_v2", "1");
              window.TournyxAndroidBridge.requestAllAppPermissions();
            }
          } catch (e) {}
        } else if (platform === "ios" && window.Capacitor?.Plugins?.Geolocation?.requestPermissions) {
          try {
            if (localStorage.getItem("tx_perms_boot_v2") !== "1") {
              localStorage.setItem("tx_perms_boot_v2", "1");
              window.Capacitor.Plugins.Geolocation.requestPermissions().catch(() => {});
            }
          } catch (e) {}
        }
      }

      // Frameless 3.5-Second Metallic TX Dragon Splash
      function runColdSplash(onComplete) {
        const splash = document.createElement("div");
        splash.id = "tx-animated-splash";
        splash.setAttribute("aria-label", "Tournyx Esports");
        splash.innerHTML = `
          <div class="tx-splash-aura" aria-hidden="true"></div>
          <div class="tx-splash-emblem-stage">
            <img class="tx-splash-emblem-img" src="logo-transparent.png" onerror="this.onerror=null;this.src='favicon.png'" alt="Tournyx Esports">
            <div class="tx-splash-chrome-mask" aria-hidden="true"></div>
          </div>
          <div class="tx-splash-wordmark">
            <div class="tx-splash-brand-title">TOURNYX</div>
            <div class="tx-splash-brand-sub">ESPORTS ARENA</div>
          </div>
        `;
        document.body.appendChild(splash);
        try { window.Capacitor?.Plugins?.SplashScreen?.hide?.(); } catch (e) {}

        const reduce = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;
        const durationMs = reduce ? 350 : 3450;

        setTimeout(() => {
          splash.classList.add("is-hiding");
          setTimeout(() => {
            splash.remove();
            onComplete();
          }, 420);
        }, durationMs);
      }

      function initNativeHooks() {
        if (!isCapacitor) return;
        const plugins = window.Capacitor?.Plugins || {};
        try {
          plugins.StatusBar?.setBackgroundColor?.({ color: "#050508" });
          plugins.StatusBar?.setStyle?.({ style: "DARK" });

          plugins.App?.addListener?.("appUrlOpen", (event) => {
            const url = event?.url || "";
            if (!url) return;
            if (url.toLowerCase().startsWith(OAUTH_CALLBACK_URI)) {
              handleOAuthReturn(url);
              return;
            }
            const resolved = resolvePageUrl(url);
            if (resolved) navigate(resolved, { force: true });
          });

          // Multi-Level Smart Hardware Back Stack + Continuous-Back Exit Permission
          plugins.App?.addListener?.("backButton", () => {
            // 1. If Exit Confirmation Dialog is already showing, continuous Back exits immediately
            if (exitConfirmEl?.classList.contains("is-active")) {
              if (Date.now() - exitPromptOpenedAt > 250) {
                toggleExitConfirm(false);
                plugins.App?.exitApp?.();
              }
              return;
            }

            const activeWin = activeLayer === "clans" ? clansFrame.contentWindow : mainFrame.contentWindow;
            try {
              const doc = activeWin?.document;
              // 2. Close Fullscreen YouTube Player first if open
              const ytPlayer = doc?.getElementById("tx-yt-player-overlay");
              if (ytPlayer?.classList.contains("is-active") && typeof activeWin.TournyxVideoEngine?.close === "function") {
                activeWin.TournyxVideoEngine.close();
                return;
              }
              // 3. Close Sidebar Drawer
              const drawer = doc?.getElementById("commandDrawer");
              if (drawer?.classList.contains("active") && typeof activeWin.toggleCommandDrawer === "function") {
                activeWin.toggleCommandDrawer(false);
                return;
              }
              // 4. Close Active Modals / Video Theater / Bottom Sheets
              const sheets = doc?.querySelectorAll(".sheet-overlay.active, .modal.active, .modal.show");
              if (sheets && sheets.length > 0) {
                const top = sheets[sheets.length - 1];
                if (top.id === "theaterPlayerModal" && typeof activeWin.closeTheaterPlayer === "function") {
                  activeWin.closeTheaterPlayer();
                  return;
                }
                if (top.id && typeof activeWin.closeModal === "function") {
                  activeWin.closeModal(top.id);
                  return;
                }
                top.classList.remove("active", "show");
                doc.body.classList.remove("modal-open");
                return;
              }
              // 5. My Clan Dashboard -> Return to My Clans / All Clans List FIRST
              if (activeLayer === "clans" && typeof activeWin.__txHandleClanBack === "function") {
                if (activeWin.__txHandleClanBack() === true) {
                  return;
                }
              }
            } catch (e) {}

            // 6. Non-Home Tabs -> Return to Home
            const pageFile = (currentPage.split("?")[0] || "index.html").toLowerCase();
            if (pageFile !== "index.html" && pageFile !== "login.html") {
              navigate("index.html", { force: true });
              return;
            }

            // 7. If Connected in Active Squad Voice -> Minimize Cleanly to Background (Never Drop Call)
            if (voiceState.active && window.TournyxAndroidBridge?.moveToBackground) {
              window.TournyxAndroidBridge.moveToBackground();
              return;
            }

            // 8. Ask User Permission Before Exiting (Continuous Back Confirms Instantly)
            toggleExitConfirm(true);
          });
        } catch (e) {}
      }

      window.addEventListener("DOMContentLoaded", async () => {
        initNativeHooks();
        initLiquidDockScrubbing();
        initNetworkTelemetry();
        await hydrateNativePreferences();

        try {
          if (platform === "android" && window.TournyxAndroidBridge && !voiceState.active) {
            window.TournyxAndroidBridge.stopVoiceService();
          }
        } catch (e) {}

        const params = new URLSearchParams(window.location.search);
        const requested = resolvePageUrl(params.get("page") || "index.html") || "index.html";
        const initialTarget = hasValidUser() ? requested : "login.html";

        navigate(initialTarget, { force: true, silent: true });
        runColdSplash(() => {
          updateDockAndPillVisibility();
          triggerStartupNativePermissions();
        });
      });
    })();
  </script>
</body>
