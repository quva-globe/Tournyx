[package]
name = "tournyx-esports"
version = "6.0.0"
description = "Tournyx Esports Desktop Application (macOS Liquid Glass & Windows Obsidian)"
authors = ["Tournyx Esports Pvt Ltd"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
window-vibrancy = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
