name: Build Tournyx All Platforms (Android, Windows, macOS, iOS)

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build Android (.apk + signed .aab if keystore secrets exist)"
        type: boolean
        default: true
      build_windows:
        description: "Build Windows (.exe & .msi installer)"
        type: boolean
        default: true
      build_macos:
        description: "Build macOS Liquid Glass (.dmg installer)"
        type: boolean
        default: true
      build_ios:
        description: "Build iOS Liquid Glass (unsigned .ipa)"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ==========================================================
  # 1. ANDROID (Obsidian GPU-Safe .apk + optional signed .aab)
  # ==========================================================
  build-android:
    name: Android APK / AAB
    if: ${{ github.event_name == 'push' || inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tournyx Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Pre-Installed Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR=$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKMGR" ]; then
            (yes || true) | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install Dependencies & Compile Local Bundle (www/)
        run: |
          npm install
          npm run prep:www
          test -f www/vendor/tournyx.min.css
          test -f www/vendor/native-app-shell.css
          test -f www/native-bridge.js

      - name: Initialize, Patch & Inject Official Tournyx Icons
        run: |
          npx cap add android
          node scripts/patch-native.mjs android
          node scripts/build-icons.mjs android
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          test -f android/app/src/main/res/values/ic_launcher_background.xml
          npx cap sync android

      - name: Build Installable Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Signed Play Store Release (When Keystore Secrets Exist)
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Keystore secret detected — building signed Play Store release..."
            echo "$KEYSTORE_B64" | base64 --decode > app/release-keystore.jks
            ./gradlew assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file="$(pwd)/app/release-keystore.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
            rm -f app/release-keystore.jks
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set — skipping signed Play Store bundle."
          fi

      - name: Collect Android Output Files
        run: |
          mkdir -p release-out
          cp android/app/build/outputs/apk/debug/app-debug.apk release-out/Tournyx-Esports-Android.apk
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-out/Tournyx-Esports-Android-Signed.apk
          fi
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab release-out/Tournyx-Esports-PlayStore.aab
          fi

      - name: Upload Android APK / AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tournyx-Android-Package
          path: release-out/*
          retention-days: 30

  # ==========================================================
  # 2. WINDOWS (Obsidian Mica + Tray .exe / .msi via Tauri v2)
  # ==========================================================
  build-windows:
    name: Windows Installer (.exe / .msi)
    if: ${{ github.event_name == 'push' || inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - name: Checkout Tournyx Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Dependencies & Compile Local Bundle (www/)
        run: |
          npm install
          npm run prep:www

      - name: Generate Official Tournyx Desktop Icons & Build Installer
        shell: pwsh
        run: |
          node scripts/build-icons.mjs source
          if (!(Test-Path "assets/icon-only.png")) { throw "Missing assets/icon-only.png" }
          npx tauri icon assets/icon-only.png
          npx tauri build

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: Tournyx-Windows-Installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

  # ==========================================================
  # 3. macOS (Apple Liquid Glass Vibrancy .dmg via Tauri v2)
  # ==========================================================
  build-macos:
    name: macOS Installer (.dmg)
    if: ${{ github.event_name == 'push' || inputs.build_macos }}
    runs-on: macos-latest
    steps:
      - name: Checkout Tournyx Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Dependencies & Compile Local Bundle (www/)
        run: |
          npm install
          npm run prep:www

      - name: Generate Official Tournyx Mac Icons & Build DMG
        run: |
          node scripts/build-icons.mjs source
          test -f assets/icon-only.png
          npx tauri icon assets/icon-only.png
          npx tauri build

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Tournyx-macOS-DMG
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30

  # ==========================================================
  # 4. iOS (Apple Liquid Glass Unsigned .ipa via Capacitor 6)
  # ==========================================================
  build-ios:
    name: iOS Package (.ipa)
    if: ${{ github.event_name == 'push' || inputs.build_ios }}
    runs-on: macos-latest
    env:
      LANG: en_US.UTF-8
    steps:
      - name: Checkout Tournyx Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies & Compile Local Bundle (www/)
        run: |
          npm install
          npm run prep:www
          test -f www/vendor/tournyx.min.css
          test -f www/vendor/native-app-shell.css

      - name: Initialize, Patch & Inject Official Tournyx iOS Icons
        run: |
          npx cap add ios
          node scripts/patch-native.mjs ios
          node scripts/build-icons.mjs ios
          test -f ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          npx cap sync ios

      - name: Build Unsigned iOS App & Package IPA
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcodebuild \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath ios/build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_IDENTITY="" \
              build
          else
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath ios/build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_IDENTITY="" \
              build
          fi

          mkdir -p ios-out/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/App.app ios-out/Payload/
          cd ios-out
          zip -r Tournyx-Esports-iOS-Unsigned.ipa Payload

      - name: Upload iOS Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tournyx-iOS-Unsigned-IPA
          path: ios-out/Tournyx-Esports-iOS-Unsigned.ipa
          retention-days: 30
