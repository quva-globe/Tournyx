name: Update Brand Icons & OG Banner (No Terminal)

on:
  workflow_dispatch:
    inputs:
      replace_og_images:
        description: "Auto-update og:image & twitter:image on clans.html / index.html / explore.html to og-banner.png"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  update-icons:
    name: Generate All Sizes & Commit to main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Sharp & Generate All Website Logo Sizes
        run: |
          npm install
          node scripts/build-icons.mjs web
          test -f favicon.png
          test -f favicon.ico
          test -f apple-touch-icon.png
          test -f og-banner.png

      - name: Replace Old Free Fire og:image With New Tournyx OG Banner
        if: ${{ inputs.replace_og_images }}
        run: |
          node -e '
            const fs = require("node:fs");
            const files = ["clans.html", "index.html", "explore.html", "matches.html", "reels.html", "login.html"];
            for (const f of files) {
              if (!fs.existsSync(f)) continue;
              let html = fs.readFileSync(f, "utf8");
              const next = html
                .replace(/(<meta[^>]+property=["\x27]og:image["\x27][^>]+content=["\x27])[^"\x27]+(["\x27][^>]*>)/gi, "$1https://tournyx.in/og-banner.png$2")
                .replace(/(<meta[^>]+name=["\x27]twitter:image["\x27][^>]+content=["\x27])[^"\x27]+(["\x27][^>]*>)/gi, "$1https://tournyx.in/og-banner.png$2");
              if (next !== html) {
                fs.writeFileSync(f, next, "utf8");
                console.log("✅ Updated og:image in " + f);
              }
            }
          '

      - name: Commit & Push Updated Icons + OG Banner to main
        run: |
          git config user.name "Tournyx Brand Bot"
          git config user.email "actions@users.noreply.github.com"
          git add favicon.png favicon.ico apple-touch-icon.png og-banner.png *.html
          if git diff --cached --quiet; then
            echo "No brand icon changes to commit."
          else
            git commit -m "Update Tournyx gradient brand icons & og-banner.png"
            git push origin main
          fi

      - name: Upload Downloadable Brand Icon Pack (All Sizes)
        uses: actions/upload-artifact@v4
        with:
          name: Tournyx-Brand-Icons-Pack
          path: |
            favicon.png
            favicon.ico
            apple-touch-icon.png
            og-banner.png
            assets/icon-only.png
            assets/icon-foreground.png
          retention-days: 30
